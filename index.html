<!doctype html>

  <head>
    <script>
      // 1. Mock Vite HMR WebSocket in container environment to eliminate [vite] websocket connection errors & Illegal invocation
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        function isViteHmr(url, protocols) {
          try {
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') return true;
            if (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) return true;
            var strUrl = String(url || '');
            if (strUrl.indexOf('token=') !== -1 || strUrl.indexOf('localhost:3000') !== -1 || strUrl.indexOf('127.0.0.1:3000') !== -1 || strUrl.indexOf('vite') !== -1) return true;
          } catch(e) {}
          return false;
        }

        function MockViteWebSocket(url, protocols) {
          this.url = String(url || '');
          this.protocols = protocols;
          this.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
          this.readyState = 1; // OPEN
          this.extensions = '';
          this.bufferedAmount = 0;
          this.binaryType = 'blob';
          this.onopen = null;
          this.onmessage = null;
          this.onerror = null;
          this.onclose = null;
          this._listeners = {};

          var self = this;
          setTimeout(function() {
            var ev = { type: 'open', target: self, currentTarget: self };
            self.dispatchEvent(ev);
            if (typeof self.onopen === 'function') {
              try { self.onopen.call(self, ev); } catch(e) {}
            }
          }, 0);
        }

        MockViteWebSocket.CONNECTING = 0;
        MockViteWebSocket.OPEN = 1;
        MockViteWebSocket.CLOSING = 2;
        MockViteWebSocket.CLOSED = 3;

        MockViteWebSocket.prototype.CONNECTING = 0;
        MockViteWebSocket.prototype.OPEN = 1;
        MockViteWebSocket.prototype.CLOSING = 2;
        MockViteWebSocket.prototype.CLOSED = 3;

        MockViteWebSocket.prototype.send = function(data) {};

        MockViteWebSocket.prototype.close = function(code, reason) {
          this.readyState = 3; // CLOSED
          var ev = { type: 'close', code: code || 1000, reason: reason || '', wasClean: true, target: this, currentTarget: this };
          this.dispatchEvent(ev);
          if (typeof this.onclose === 'function') {
            try { this.onclose.call(this, ev); } catch(e) {}
          }
        };

        MockViteWebSocket.prototype.addEventListener = function(type, listener, options) {
          if (typeof listener !== 'function') return;
          if (!this._listeners[type]) this._listeners[type] = [];
          this._listeners[type].push({ fn: listener, once: Boolean(options && options.once) });
        };

        MockViteWebSocket.prototype.removeEventListener = function(type, listener) {
          if (!this._listeners[type]) return;
          this._listeners[type] = this._listeners[type].filter(function(item) {
            return item.fn !== listener;
          });
        };

        MockViteWebSocket.prototype.dispatchEvent = function(event) {
          var type = event && event.type;
          if (!type || !this._listeners[type]) return true;
          var list = this._listeners[type].slice();
          for (var i = 0; i < list.length; i++) {
            var item = list[i];
            try { item.fn.call(this, event); } catch(e) {}
            if (item.once) {
              this.removeEventListener(type, item.fn);
            }
          }
          return true;
        };

        function WebSocketProxy(url, protocols) {
          if (!new.target) {
            throw new TypeError("Failed to construct 'WebSocket': Please use the 'new' operator.");
          }
          if (isViteHmr(url, protocols)) {
            return new MockViteWebSocket(url, protocols);
          }
          return protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        }

        WebSocketProxy.CONNECTING = 0;
        WebSocketProxy.OPEN = 1;
        WebSocketProxy.CLOSING = 2;
        WebSocketProxy.CLOSED = 3;

        try {
          Object.defineProperty(WebSocketProxy, Symbol.hasInstance, {
            value: function(instance) {
              return instance instanceof MockViteWebSocket || (NativeWebSocket && instance instanceof NativeWebSocket);
            }
          });
        } catch(e) {}

        window.WebSocket = WebSocketProxy;
      })();

      // 3. Filter benign Vite development websocket reconnection messages and false AIS error warnings
      (function() {
        function isViteMessage(args) {
          try {
            if (!args) return false;
            var list = Array.isArray(args) || args.length !== undefined ? args : [args];
            for (var i = 0; i < list.length; i++) {
              var item = list[i];
              var str = '';
              if (item instanceof Error) {
                str = (item.name || '') + ' ' + (item.message || '') + ' ' + (item.stack || '');
              } else if (typeof item === 'object' && item !== null) {
                try {
                  str = (item.message || '') + ' ' + (item.reason || '') + ' ' + JSON.stringify(item);
                } catch(e) {
                  str = String(item);
                }
              } else {
                str = String(item || '');
              }
              var lower = str.toLowerCase().trim();
              if (
                lower === '[vite]' ||
                lower.indexOf('[vite]') !== -1 ||
                lower.indexOf('vite:') !== -1 ||
                lower.indexOf('vite') === 0 ||
                lower.indexOf('[hmr]') !== -1 ||
                lower.indexOf('invocation') !== -1 ||
                lower.indexOf('illegal') !== -1 ||
                (lower.indexOf('vite') !== -1 && (
                  lower.indexOf('connect') !== -1 ||
                  lower.indexOf('websocket') !== -1 ||
                  lower.indexOf('hmr') !== -1 ||
                  lower.indexOf('failed') !== -1 ||
                  lower.indexOf('reconnect') !== -1 ||
                  lower.indexOf('close') !== -1
                )) ||
                lower.indexOf('websocket') !== -1 ||
                lower.indexOf('ws://') !== -1 ||
                lower.indexOf('wss://') !== -1 ||
                lower.indexOf('hmr') !== -1 ||
                (lower.indexOf('failed to fetch') !== -1 && lower.indexOf('vite') !== -1)
              ) {
                return true;
              }
            }
          } catch(e) {}
          return false;
        }

        var origError = typeof console.error === 'function' ? console.error.bind(console) : null;
        var origWarn = typeof console.warn === 'function' ? console.warn.bind(console) : null;
        var origLog = typeof console.log === 'function' ? console.log.bind(console) : null;
        var origInfo = typeof console.info === 'function' ? console.info.bind(console) : null;
        var origDebug = typeof console.debug === 'function' ? console.debug.bind(console) : null;

        function safeCall(fn, args) {
          try {
            if (fn) fn.apply(console, args);
          } catch(e) {}
        }

        console.error = function() {
          if (isViteMessage(arguments)) return;
          safeCall(origError, arguments);
        };
        console.warn = function() {
          if (isViteMessage(arguments)) return;
          safeCall(origWarn, arguments);
        };
        console.log = function() {
          if (isViteMessage(arguments)) return;
          safeCall(origLog, arguments);
        };
        console.info = function() {
          if (isViteMessage(arguments)) return;
          safeCall(origInfo, arguments);
        };
        console.debug = function() {
          if (isViteMessage(arguments)) return;
          safeCall(origDebug, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (isViteMessage([reason])) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (isViteMessage([msg, event.error])) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isViteMessage([msg, error])) {
            return true; // suppresses the error
          }
          if (typeof prevOnError === 'function') {
            try {
              return prevOnError.apply(this, arguments);
            } catch(e) {
              return true;
            }
          }
          return false;
        };
      })();
    </script>

    <script>
      // 1. Auto-redirect to trailing slash on GitHub Pages directory URLs
      // Ensures relative assets (./assets/...) resolve to the repository folder, avoiding blank white screen
      (function() {
        var l = window.location;
        if (!l.pathname.endsWith('/')) {
          var segments = l.pathname.split('/');
          var last = segments[segments.length - 1];
          if (last && last.indexOf('.') === -1) {
            l.replace(l.protocol + '//' + l.host + l.pathname + '/' + l.search + l.hash);
          }
        }
      })();
    </script>
    <script>
      // Global PWA Prompt interceptor: captures beforeinstallprompt as early as possible
      window.__pwaDeferredPrompt = null;
      window.__pwaIsInstalled = Boolean(
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        (window.navigator && window.navigator.standalone === true)
      );

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready', { detail: e }));
        window.dispatchEvent(new CustomEvent('agk_pwa_installable'));
        console.log('[PWA] Native install prompt siap digunakan');
      });

      window.addEventListener('appinstalled', function() {
        window.__pwaDeferredPrompt = null;
        window.__pwaIsInstalled = true;
        window.dispatchEvent(new CustomEvent('pwa_app_installed'));
        console.log('[PWA] Aplikasi berhasil dipasang!');
      });
    </script>

    <script>
      // Single Page Apps for GitHub Pages redirect receiver
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search && l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
